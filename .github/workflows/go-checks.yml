name: Go Checks

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # golangci-lint-action defaults to `verify: true`, which runs
          # `golangci-lint config verify` and fetches the JSON schema for
          # .golangci.yml from https://golangci-lint.run over the network.
          # That remote fetch is flaky in CI and has caused non-deterministic
          # lint-job failures unrelated to the code/config
          # (context deadline exceeded). golangci-lint run still validates
          # the config at runtime, so disable the network-dependent check.
          verify: false
